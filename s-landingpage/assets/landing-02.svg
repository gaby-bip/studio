<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Mockup de Landing Page para produtos">
  <defs>
    <linearGradient id="wsprod-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3829"/>
      <stop offset="0.55" stop-color="#20271D"/>
      <stop offset="1" stop-color="#171C14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#wsprod-bg)"/>

  <!-- Navegação do site -->
  <g>
    <circle cx="64" cy="52" r="6" fill="#E83E78"/>
    <text x="78" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" letter-spacing="2" fill="#FFF5E8">NOVA</text>
    <rect x="470" y="47" width="46" height="9" rx="4.5" fill="#A9C08A" opacity="0.55"/>
    <rect x="528" y="47" width="46" height="9" rx="4.5" fill="#A9C08A" opacity="0.35"/>
    <rect x="586" y="47" width="46" height="9" rx="4.5" fill="#A9C08A" opacity="0.35"/>
    <rect x="646" y="38" width="92" height="28" rx="14" fill="#E83E78"/>
  </g>

  <!-- Hero centrado -->
  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#A9C08A">LANÇAMENTO EXCLUSIVO</text>
  <text x="400" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="-0.5" font-size="36" fill="#FFF5E8">O produto que faltava</text>
  <text x="400" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="-0.5" font-size="36" fill="#F2C230">para o seu dia a dia.</text>
  <rect x="340" y="244" width="120" height="32" rx="16" fill="#E83E78"/>

  <!-- Vitrine de produtos -->
  <g>
    <rect x="64" y="310" width="200" height="150" rx="14" fill="#2A3326" stroke="#A9C08A" stroke-opacity="0.25"/>
    <rect x="132" y="330" width="64" height="56" rx="8" fill="#465B32"/>
    <rect x="92" y="404" width="110" height="8" rx="4" fill="#A9C08A" opacity="0.6"/>
    <rect x="92" y="422" width="64" height="12" rx="6" fill="#E83E78"/>

    <rect x="300" y="310" width="200" height="150" rx="14" fill="#2A3326" stroke="#E83E78" stroke-opacity="0.55"/>
    <rect x="368" y="330" width="64" height="56" rx="8" fill="#465B32"/>
    <rect x="328" y="404" width="110" height="8" rx="4" fill="#A9C08A" opacity="0.6"/>
    <rect x="328" y="422" width="64" height="12" rx="6" fill="#E83E78"/>
    <rect x="440" y="296" width="72" height="22" rx="11" fill="#E83E78"/>

    <rect x="536" y="310" width="200" height="150" rx="14" fill="#2A3326" stroke="#A9C08A" stroke-opacity="0.25"/>
    <rect x="604" y="330" width="64" height="56" rx="8" fill="#465B32"/>
    <rect x="564" y="404" width="110" height="8" rx="4" fill="#A9C08A" opacity="0.6"/>
    <rect x="564" y="422" width="64" height="12" rx="6" fill="#E83E78"/>
  </g>

  <!-- Brilho decorativo -->
  <circle cx="720" cy="80" r="120" fill="#465B32" opacity="0.35"/>
</svg>
