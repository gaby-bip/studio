  <g>
    <rect x="64" y="384" width="672" height="76" rx="14" fill="#FFFFFF" stroke="#EAD9C0"/>
    <circle cx="104" cy="422" r="16" fill="#A9C08A" opacity="0.5"/>
    <rect x="136" y="404" width="220" height="9" rx="4.5" fill="#465B32" opacity="0.8"/>
