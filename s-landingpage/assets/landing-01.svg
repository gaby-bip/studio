<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Mockup de Landing Page para serviços profissionais">
  <rect width="800" height="500" fill="#FFF5E8"/>

  <!-- Navegação do site -->
  <g>
    <circle cx="64" cy="52" r="6" fill="#E83E78"/>
    <text x="78" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="17" letter-spacing="2" fill="#20271D">ATUAL</text>
