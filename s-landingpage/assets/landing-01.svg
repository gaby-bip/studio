    <rect x="470" y="120" width="266" height="220" rx="16" fill="#FFFFFF" stroke="#EAD9C0"/>
    <rect x="494" y="144" width="90" height="9" rx="4.5" fill="#465B32"/>
    <rect x="494" y="162" width="130" height="7" rx="3.5" fill="#EAD9C0"/>
