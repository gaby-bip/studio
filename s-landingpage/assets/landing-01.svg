  <rect x="64" y="266" width="260" height="9" rx="4.5" fill="#5B6150" opacity="0.35"/>
  <rect x="64" y="304" width="140" height="34" rx="17" fill="#E83E78"/>
  <rect x="218" y="304" width="140" height="34" rx="17" fill="none" stroke="#465B32" stroke-width="1.5"/>

  <!-- Hero: cartão com gráfico à direita -->
